name: Deploy Gestion de Visitas to Azure

on:
  push:
    branches:
      - main

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # Build and Push API Docker Image (api-visitas)
  # =======================================================
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🔐 Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🐳 Build and push Docker image (api-visitas)
        run: |
          docker build ./api-visitas \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas --all-tags

      - name: 🚀 Deploy API to Azure Web App (Container)
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "🔄 Updating container image in Azure Web App..."
            az webapp config container set \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas \
              --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }}" \
              --container-registry-url "https://${{ secrets.ACR_LOGIN_SERVER }}" \
              --container-registry-user "${{ secrets.ACR_USERNAME }}" \
              --container-registry-password "${{ secrets.ACR_PASSWORD }}"

            echo "🧹 Forcing update of container configuration..."
            az webapp config set \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas \
              --linux-fx-version "DOCKER|${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }}"

            echo "🚀 Restarting the app..."
            az webapp restart \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas

            echo "✅ Deployment complete for API container."

  # =======================================================
  # Frontend (Vue)
  # =======================================================
  visitas-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push-api   # Espera que el backend termine correctamente

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: visitas-frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: visitas-frontend
        run: npm ci

      - name: 🏗️ Build project
        working-directory: visitas-frontend
        run: npm run build

      - name: 📦 Archive build output
        working-directory: visitas-frontend/dist
        run: zip -r visitas.zip ./*

      - name: 🚀 Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: visitas-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONT }}
          package: ./visitas-frontend/dist/visitas.zip
