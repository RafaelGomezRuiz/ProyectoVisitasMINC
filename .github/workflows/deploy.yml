name: Deploy Gestion de Visitas to Azure

on:
  push:
    branches:
      - main

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # Build and Push API Docker Image (api-visitas)
  # =======================================================
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build ./api-visitas \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas --all-tags

      - name: Deploy API to Azure Web App (Container)
        uses: azure/webapps-deploy@v2
        with:
          app-name: api-visitas-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }}

  # =======================================================
  # Frontend (Vue)
  # =======================================================
  visitas-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: visitas-frontend/package-lock.json

      - name: Install dependencies
        working-directory: visitas-frontend
        run: npm ci

      - name: Build project
        working-directory: visitas-frontend
        run: npm run build

      - name: Archive build
        working-directory: visitas-frontend/dist
        run: zip -r visitas.zip ./*

      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: visitas-frontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONT }}
          package: ./visitas-frontend/dist/visitas.zip
