name: Deploy Gestion de Visitas to Azure

on:
  push:
    branches:
      - main

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # Build and Push API Docker Image (api-visitas)
  # =======================================================
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🐳 Build and push Docker image (api-visitas)
        run: |
          echo "🚧 Building Docker image for API..."
          docker build ./api-visitas \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:latest
          echo "📤 Pushing Docker image to ACR..."
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/api-visitas --all-tags
          echo "✅ Docker image pushed successfully."

      - name: 🔑 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy API to Azure Web App (Container)
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "🔄 Updating container image in Azure Web App..."
            az webapp config container set \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas \
              --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }}" \
              --container-registry-url "https://${{ secrets.ACR_LOGIN_SERVER }}" \
              --container-registry-user "${{ secrets.ACR_USERNAME }}" \
              --container-registry-password "${{ secrets.ACR_PASSWORD }}"

            echo "🧹 Forcing container configuration update..."
            az webapp config set \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas \
              --linux-fx-version "DOCKER|${{ secrets.ACR_LOGIN_SERVER }}/api-visitas:${{ github.sha }}"

            echo "🚀 Restarting API container..."
            az webapp restart \
              --name api-visitas-backend \
              --resource-group rg-gestion-visitas

            echo "✅ API deployment complete."

  # =======================================================
  # Frontend (Vue/Vite) - App Service
  # =======================================================
  visitas-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push-api

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: visitas-frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: visitas-frontend
        run: npm ci

      - name: 🏗️ Build project
        working-directory: visitas-frontend
        run: npm run build

      - name: 🗜️ Package dist folder for deployment (adds web.config for SPA routing)
        run: |
          cd visitas-frontend/dist
          # Crear web.config con heredoc para evitar problemas de comillas/escape
          cat <<'EOF' > web.config
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="VueRoutes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

          zip -r ../../visitas.zip .

      - name: 🔑 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy Frontend to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "📤 Deploying Vue build to Azure App Service..."
            az webapp deploy \
              --name visitas-frontend \
              --resource-group rg-gestion-visitas \
              --src-path visitas.zip \
              --type zip \
              --clean true

            echo "🔄 Restarting visitas-frontend..."
            az webapp restart \
              --name visitas-frontend \
              --resource-group rg-gestion-visitas

            echo "✅ Frontend deployed successfully!"
