services:
  # ──────────────────────────────────────────────
  # Base de datos MySQL
  # ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: visitas_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: visitas
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usecret", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # API Backend Laravel
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./api-visitas
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Gestión de Visitas MINC"
      APP_ENV: production
      APP_KEY: base64:REEMPLAZAR_CON_php_artisan_key_generate
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: visitas_db
      DB_USERNAME: visitas
      DB_PASSWORD: secret
      JWT_SECRET: REEMPLAZAR_CON_php_artisan_jwt_secret
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persiste storage de Laravel (uploads, logs)
      - api_storage:/var/www/html/storage/app
      - api_logs:/var/www/html/storage/logs

  # ──────────────────────────────────────────────
  # Frontend Vue 3 (nginx sirviendo el build)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./visitas-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db_data:
  api_storage:
  api_logs:
